# HSI candidate configuration; tensor_shape is set by the data loader.
model:
  tensor_shape: !!python/tuple [305, 340, 103]
  h_dim: !!python/tuple [128, 128] #[64, 64]
  act: 'relu' #'relu' 'silu'
  latent_dim: 64 #64
  x_emb_size: 16 #16
  t_emb_size: 16 #16
  sigma_func: 'softplus'
  dropout: 0.0
  pooling_method: 'cat' #'cat'
  skip_connection: true
  posdim: 32 #32
  rank: 8 # Tested Gaussian recipe; WDC Case 3 used --rank 16. See study results.
  rff_alpha: 4.0 #4.0
  rff_sigma: 8.0 #8.0

diffusion:
  seq_length: 1
  channels: 1
  timesteps: 1 #1
  sampling_timesteps: 1 #1
  objective: 'pred_x0' #'pred_x0'
  beta_schedule: 'cosine' #cosine
  ddim_sampling_eta: 0.0
  auto_normalize: True #normalize to -1 to 1
  self_condition: False
  channel_first: False
  sparse_enabled: True # Retain robust residual handling, including Gaussian Case 1.
  sparse_threshold: 0.04 # In [-1, 1] units, equivalent to 0.02 in image units.
  smooth_weight: 0.01 # Supported by matched diagnostic runs; full dataset means remain to be measured.
  smooth_scope: 'spatial'
  smooth_std: 1.0

trainer:
  train_batch_size: 8192 #256
  gradient_accumulate_every: 1
  train_lr: 0.001 #网络越宽 lr越小 0.001
  adam_betas: !!python/tuple [0.9, 0.99]
  weight_decay: 0.0
  scheduler: 'cosine'
  train_num_steps: 40000 #20000 
  ema_update_every: 2
  ema_decay: 0.995
  save_and_sample_every: 1000
  results_folder: './results'
  amp: False
  mixed_precision_type: 'fp16'
  split_batches: False
  max_grad_norm: 2.0
  norm_type: 'inf'
