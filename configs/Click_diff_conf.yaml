model:
  tensor_shape: !!python/tuple [7, 2842, 4127]
  h_dim: !!python/tuple [64, 64] #[64, 64]
  act: 'gelu' #gelu
  latent_dim: 16 #16
  x_emb_size: 8 #8
  sigma_func: 'softplus'
  dropout: 0.0 #0.0
  pooling_method: 'cat'
  skip_connection: True

diffusion:
  seq_length: 1
  channels: 1
  timesteps: 1 #1
  sampling_timesteps: 1 #1
  objective: 'pred_x0'
  beta_schedule: 'cosine'
  ddim_sampling_eta: 0.0
  auto_normalize: True #normalize to -1 to 1
  self_condition: False
  channel_first: False

trainer:
  train_batch_size: 2048 #2048
  gradient_accumulate_every: 1
  train_lr: 0.01 #0.01
  adam_betas: !!python/tuple [0.9, 0.99]
  weight_decay: 0.0
  scheduler: 'cosine'
  train_num_steps: 10000
  ema_update_every: 2 #2
  ema_decay: 0.995
  save_and_sample_every: 100
  results_folder: './results'
  amp: False
  mixed_precision_type: 'fp16'
  split_batches: False
  max_grad_norm: 5.0
  norm_type: 'inf'

